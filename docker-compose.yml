version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: hire_genius_db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: hire_genius
      MYSQL_USER: hire_user
      MYSQL_PASSWORD: hire_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hire_genius_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    container_name: hire_genius_backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=mysql+pymysql://hire_user:hire_password@db:3306/hire_genius
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery:
    build: ./backend
    container_name: hire_genius_celery
    env_file: .env
    environment:
      - DATABASE_URL=mysql+pymysql://hire_user:hire_password@db:3306/hire_genius
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis
    command: celery -A app.celery_app worker --loglevel=info

  celery-beat:
    build: ./backend
    container_name: hire_genius_celery_beat
    env_file: .env
    environment:
      - DATABASE_URL=mysql+pymysql://hire_user:hire_password@db:3306/hire_genius
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      - celery
    command: celery -A app.celery_app beat --loglevel=info --scheduler celery.beat:PersistentScheduler

  frontend:
    build: ./frontend
    container_name: hire_genius_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000/api

volumes:
  mysql_data:
  redis_data:
