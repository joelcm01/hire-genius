version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: hire_genius_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: hire_genius
      MYSQL_USER: hgenius
      MYSQL_PASSWORD: hgenius_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hire_genius_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hire_genius_backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=hire_genius;Uid=hgenius;Pwd=hgenius_pass;CharSet=utf8mb4;
      - AWS__AccessKeyId=${AWS_ACCESS_KEY_ID:-}
      - AWS__SecretAccessKey=${AWS_SECRET_ACCESS_KEY:-}
      - AWS__Region=${AWS_REGION:-us-east-1}
      - AWS__BucketName=${S3_BUCKET_NAME:-hire-genius-cvs}
      - Google__ClientId=${GOOGLE_CLIENT_ID:-}
      - Google__ClientSecret=${GOOGLE_CLIENT_SECRET:-}
      - Google__RedirectUri=http://localhost:5000/api/gdrive/auth-callback
      - Anthropic__ApiKey=${ANTHROPIC_API_KEY:-}
      - Anthropic__Model=claude-opus-4-6
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - hire_genius_net
    volumes:
      - ./backend:/app/src:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hire_genius_frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - hire_genius_net

volumes:
  mysql_data:

networks:
  hire_genius_net:
    driver: bridge
